server {
    listen 80;
    server_name api.lab.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.lab.local;
    error_log /var/log/nginx/error.log info;

    ssl_certificate /etc/nginx/certs/api.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/api.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Mutual TLS (mTLS) Authentication + Server-side Client CRL Enforcement
    ssl_client_certificate /etc/nginx/certs/ca-chain.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/certs/ca-chain.crl.pem;

    location /mtls {
        default_type application/json;
        return 200 '{"status": 200, "message": "200 OK - mTLS Authenticated", "auth": "mTLS Authenticated", "client_dn": "$ssl_client_s_dn", "serial": "$ssl_client_serial"}\n';
    }

    location / {
        default_type application/json;
        return 200 '{"status": 200, "service": "api.lab.local", "mtls_required": true}\n';
    }
}
