server {
    listen 443 ssl;
    server_name expired.lab.local;

    ssl_certificate /etc/nginx/certs/expired.crt;
    ssl_certificate_key /etc/nginx/certs/expired.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        return 200 "Expired Certificate Service\n";
    }
}
