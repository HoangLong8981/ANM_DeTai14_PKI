server {
    listen 443 ssl;
    server_name revoked.lab.local;

    ssl_certificate /etc/nginx/certs/revoked.crt;
    ssl_certificate_key /etc/nginx/certs/revoked.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Server cert (revoked.crt) is listed in inter.crl.pem;
    # revocation check of server certificates is performed by clients (TC06).

    location / {
        default_type text/plain;
        return 200 "Revoked Certificate Service\n";
    }
}
