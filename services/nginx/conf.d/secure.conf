server {
    listen 80;
    server_name secure.lab.local localhost 127.0.0.1;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name secure.lab.local localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/secure.crt;
    ssl_certificate_key /etc/nginx/certs/secure.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        default_type text/html;
        return 200 "<html><body><h1>200 OK - Secure Web Service</h1><p>HTTPS connection established successfully with valid PKI Certificate.</p></body></html>\n";
    }
}
